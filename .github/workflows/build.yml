# SA-COOP Nostalgia: builds on every push to main. When nostalgia/versao.txt names a version that has no release yet
# (nostalgia-2, say), it also publishes that release, with the files the updater (nostalgia/coop/atualizador.ps1)
# downloads and the installer zip for new players. The release text is nostalgia/notas-da-versao.md.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the compiler
        uses: actions/cache@v4
        with:
          path: toolchain/llvm-mingw
          key: llvm-mingw-20261006-ucrt-x86_64

      - name: Get the compiler
        shell: pwsh
        run: ./tools/get-toolchain.ps1

      - name: Check the layers (Feature-Sliced Design)
        run: python tools/fsd_check.py

      - name: Check that every text of the game has its English one
        run: python tools/i18n_check.py
        env:
          PYTHONIOENCODING: utf-8  # it prints the Russian texts it finds

      - name: Build
        run: python tools/build.py dist

      - name: Files for the updater and the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/SA-COOP/coop.asi release/
          Copy-Item dist/SA-COOP/coop/coop.pdb release/
          Copy-Item dist/SA-COOP/coop/coop-server.exe release/
          Copy-Item nostalgia/coop/atualizador.ps1 release/
          Copy-Item nostalgia/coop/launcher.ps1 release/
          Copy-Item nostalgia/coop/launcher/logo.png release/
          Copy-Item nostalgia/coop/launcher/icone.ico release/
          Compress-Archive -Path "nostalgia/Jogar SA-COOP.bat", "nostalgia/coop" -DestinationPath release/SA-COOP-Nostalgia-instalador.zip
          Get-ChildItem release

      # Open Limit Adjuster (MIT, github.com/GTAmodding/III.VC.SA.LimitAdjuster): its .asi as released, our .ini
      # (nostalgia/limit-adjuster: more peds and vehicles for 4 players). The updater installs them only for whoever has
      # no limit adjuster yet.
      - name: Open Limit Adjuster
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.2 --repo GTAmodding/III.VC.SA.LimitAdjuster --dir ola
          Get-ChildItem ola -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath (Join-Path ola $_.BaseName) -Force }
          $asi = @(Get-ChildItem ola -Recurse -Filter III.VC.SA.LimitAdjuster.asi)
          $asi | ForEach-Object { "$($_.FullName) $($_.Length) $((Get-FileHash $_.FullName).Hash)" }
          if ($asi.Count -eq 0) { throw 'III.VC.SA.LimitAdjuster.asi is not in the release' }
          Copy-Item $asi[0].FullName release/
          Copy-Item nostalgia/limit-adjuster/III.VC.SA.LimitAdjuster.ini release/
          Copy-Item nostalgia/limit-adjuster/OpenLimitAdjuster-LICENSE.txt release/

      - uses: actions/upload-artifact@v4
        with:
          name: SA-COOP-Nostalgia
          path: release/*

      - name: Is the version new
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content -Raw nostalgia/versao.txt).Trim()
          $found = $false
          try { gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null; $found = ($LASTEXITCODE -eq 0) } catch { }
          $new = if ($found) { 'false' } else { 'true' }
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          "version $tag, new: $new"

      - name: Publish the release
        if: github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SA-COOP Nostalgia ${{ steps.version.outputs.tag }}
          body_path: nostalgia/notas-da-versao.md
          make_latest: true
          files: |
            release/coop.asi
            release/coop.pdb
            release/coop-server.exe
            release/atualizador.ps1
            release/launcher.ps1
            release/logo.png
            release/icone.ico
            release/SA-COOP-Nostalgia-instalador.zip
            release/III.VC.SA.LimitAdjuster.asi
            release/III.VC.SA.LimitAdjuster.ini
            release/OpenLimitAdjuster-LICENSE.txt
